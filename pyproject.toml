[project]
name = "vending-outreach-automation"
version = "1.0.0"
description = "Find apartment communities and fill the Grilly Cheese vending calendar"
requires-python = ">=3.11"
dependencies = [
    "requests>=2.31",
    "PyYAML>=6.0",
    "Jinja2>=3.1",
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
    "python-dotenv>=1.0",
    "google-api-python-client>=2.120",
    "google-auth-oauthlib>=1.2",
    "google-auth>=2.28",
    "tenacity>=8.2",
    # Replit deployments persist state in Postgres; SQLite is local-only.
    "psycopg[binary]>=3.1",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
vending-outreach = "vending_outreach.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
